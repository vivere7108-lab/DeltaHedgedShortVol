# The initial forward walk: IBKR paper account, real bars, real open
# interest, one fixed heuristic delta band.
#
#   deltahedger live -c configs/es_paper.yaml --dry-run     # decides, places nothing
#   deltahedger live -c configs/es_paper.yaml               # routes to paper
#
# `allow_live_trading` stays false, so the broker refuses to connect to
# anything that is not an IBKR paper account. That is the only thing
# standing between this file and real money; leave it alone until the walk
# has actually said something.

risk_source: ES
starting_equity: 250000.0

hedge:
  target: 0.0
  band: 10.0                       # the fixed heuristic under test
  min_seconds_between_hedges: 60.0  # damp churn on noisy live quotes

gex:
  enabled: true
  refresh_seconds: 900.0

sizing:
  buying_power_pct: 0.10           # smaller than the backtest default: the
                                   # forward walk is measuring behaviour,
                                   # not compounding
  max_straddles: 10

strategy:
  min_days_to_expiry: 0
  max_days_to_expiry: 0
  entry_time: '09:35'
  entry_cutoff_time: '14:30'
  exit_on_regime_flip: true
  reenter_after_exit: true
  max_entries_per_session: 3

data:
  source: ibkr
  open_interest: ibkr              # the exchange's OI, not a generated surface
  bar_size: 5 mins

ibkr:
  host: 127.0.0.1
  port: 7497
  client_id: 17
  allow_live_trading: false
  poll_seconds: 5.0
  use_whatif_margin: true
  hedge_order_type: MKT
