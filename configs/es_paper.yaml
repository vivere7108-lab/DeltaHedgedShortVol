# The forward walk: IBKR paper account, real bars, real open interest,
# 0DTE straddles rolled at the bell, sized to the margin limit, hedged
# under a Whalley-Wilmott band.
#
#   deltahedger live -c configs/es_paper.yaml --dry-run     # decides, places nothing
#   deltahedger live -c configs/es_paper.yaml               # routes to paper
#
# `allow_live_trading` is true here because cli.py's `live` command refuses
# to route ANY non-dry-run order -- paper included -- unless it is set; it
# is not solely a live-account gate. Once it is true, it ALSO disables
# broker/ibkr.py's account-type check (which otherwise refuses to connect
# to anything but an IBKR paper account, ids beginning with `D`) -- so with
# this flag on, the only thing standing between this file and real money is
# which account the Gateway session is actually logged into. Keep `port:
# 4002` pointed at a paper Gateway (TradingMode=paper) until the walk has
# actually said something.

risk_source: ES
starting_equity: 250000.0

hedge:
  target: 0.0
  band_model: whalley_wilmott
  risk_aversion: 0.01              # per dollar; see es_default.yaml
  overnight_band_multiplier: 2.5   # wider outside RTH: the rolled 1DTE
                                   # position is carried overnight
  max_hedge_contracts: 500         # a margin-limit book can need it near the bell
  min_seconds_between_hedges: 60.0  # damp churn on noisy live quotes

gex:
  enabled: true
  refresh_seconds: 900.0
  blend_front_expiries: true       # today's series, plus tomorrow's in the
                                   # roll window
  blend_max_expiries: 4            # see `deltahedger doctor` for the
                                   # market-data-line cost of raising this

sizing:
  buying_power_pct: 0.80           # the margin limit less a 20% buffer
  hedge_margin_reserve_pct: 0.30
  max_straddles: 500

strategy:
  min_days_to_expiry: 0            # today's series ...
  max_days_to_expiry: 1            # ... or tomorrow's, in the roll window
  prefer_min_days_to_expiry: 0
  prefer_max_days_to_expiry: 0
  close_at_days_to_expiry: null
  entry_time: '09:35'
  entry_cutoff_time: '14:30'
  close_before_expiry_minutes: 15  # out before the expiry gamma spike ...
  roll_at_expiry: true             # ... and into tomorrow's series
  hold_over_weekends: false        # flat from Friday 15:45 to Monday 09:35
  events_path: configs/events.txt  # FOMC statements; verify before a walk
  event_blackout_minutes_before: 15
  event_blackout_minutes_after: 15
  exit_on_regime_flip: true
  reenter_after_exit: true
  max_entries_per_session: 3

data:
  source: ibkr
  open_interest: ibkr              # the exchange's OI, not a generated surface
  bar_size: 5 mins

ibkr:
  host: 127.0.0.1
  port: 4002                       # IB Gateway paper. TWS paper is 7497.
  client_id: 17
  allow_live_trading: true         # required by cli.py to route non-dry-run orders; see note above
  use_delayed_data: true             # paper account has no CME real-time entitlement of its own
  poll_seconds: 5.0
  use_whatif_margin: true
  hedge_order_type: MKT

live:
  # Write every decision to disk as it happens. A forward walk that only
  # exists in a process's memory is not evidence.
  journal: true
  journal_dir: runs/live
  # IBKR force-restarts the gateway daily; without this the walk goes quiet
  # after its first night while still looking healthy in the log.
  reconnect: true
  reconnect_backoff_seconds: 15.0
  max_reconnect_backoff_seconds: 300.0
  max_reconnect_attempts: null     # retry forever; systemd is the backstop
  heartbeat_seconds: 300.0
