# The same strategy with a band the hedge instrument can actually hold.
#
# One MES is 10 delta units, so a +/-3 band is narrower than the smallest
# trade and behaves identically to +/-5. Widening to +/-10 makes the band a
# real parameter again and roughly halves the hedge count.

risk_source: ES
starting_equity: 250000.0

hedge:
  target: 20.0
  band: 10.0
  min_seconds_between_hedges: 60.0   # additionally damp churn on noisy quotes

sizing:
  buying_power_pct: 0.15

data:
  source: ibkr
  bar_size: 5 mins
