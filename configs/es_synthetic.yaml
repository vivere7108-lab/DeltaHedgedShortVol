# Runs the full system on generated data, with no IBKR connection.
# Use it to exercise the machinery and to see the reporting output.
#
#   deltahedger backtest -c configs/es_synthetic.yaml
#
# Results from this config say the plumbing works. They say nothing about
# whether the strategy works: the generator draws returns using the same
# volatility it reports as implied, so there is no edge to find.

risk_source: ES
starting_equity: 250000.0

hedge:
  target: 20.0
  band: 3.0

sizing:
  buying_power_pct: 0.15

data:
  source: synthetic
  bar_size: 5 mins
  synthetic_days: 40
  synthetic_start_price: 5000.0
  synthetic_annual_vol: 0.16
  synthetic_seed: 7
