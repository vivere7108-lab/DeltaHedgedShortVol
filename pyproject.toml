[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltahedger"
version = "0.1.0"
description = "Delta-hedged short-volatility system for ES futures options, backtest + IBKR live routing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0"]
databento = ["databento>=0.86"]
# ib_async is an optional runtime extra, but the broker tests drive the
# real Order/Trade/Contract types against a fake gateway, so the dev
# environment needs it or tests/test_ibkr.py silently skips.
dev = ["pytest>=7.4", "ib_async>=1.0"]

[project.scripts]
deltahedger = "deltahedger.cli:main"

[tool.setuptools.packages.find]
include = ["deltahedger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
