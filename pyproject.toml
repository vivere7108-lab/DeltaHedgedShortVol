[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltahedger"
version = "0.1.0"
description = "Delta-hedged short-volatility system for ES futures options, backtest + IBKR live routing"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ibkr = ["ib_async>=1.0"]
dev = ["pytest>=7.4"]

[project.scripts]
deltahedger = "deltahedger.cli:main"

[tool.setuptools.packages.find]
include = ["deltahedger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
